<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나와 가장 닮은 사람 찾기</title>
    <style>
        :root {
            --bg-color: #fdfaf2;
            --border-color: #d7ccc8;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: #4e342e;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid var(--border-color);
            text-align: center;
        }

        h1 { color: #6a1b9a; font-size: 26px; margin-bottom: 10px; }
        .desc { font-size: 15px; color: #757575; margin-bottom: 25px; }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px auto;
        }

        label { font-size: 16px; font-weight: bold; }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus { border-color: #9c27b0; }

        .btn-match {
            background-color: #9c27b0;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            max-width: 400px;
        }

        .btn-match:hover { background-color: #7b1fa2; }
        .btn-match:disabled { background-color: #bdc3c7; cursor: not-allowed; }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #f3e5f5;
            border: 2px dashed #9c27b0;
            border-radius: 10px;
            text-align: left;
            display: none;
        }

        .result-box h3 {
            margin-top: 0;
            color: #4a148c;
            text-align: center;
            font-size: 20px;
            border-bottom: 1px solid #e1bee7;
            padding-bottom: 10px;
        }

        .gemini-result {
            font-size: 15px;
            line-height: 1.8;
            color: #4e342e;
            white-space: pre-wrap;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .btn-back {
            margin-top: 20px;
            background: none;
            border: none;
            color: #757575;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔮 내 소울메이트 찾기</h1>
    <div class="desc"> AI가 데이터를 분석하여<br>나와 가장 닮은 사람을 찾아드립니다.</div>

    <div class="input-group">
        <label for="searchName">내 이름 입력</label>
        <input type="text" id="searchName" placeholder="방금 제출한 이름을 입력하세요" required>
    </div>

    <button type="button" class="btn-match" id="matchBtn">🔍 닮은 사람 찾기</button>

    <div class="result-box" id="resultBox">
        <h3>💡 분석 결과</h3>
        <p id="resultSummary" style="font-size: 16px; font-weight: bold; text-align: center;"></p>
        <div id="matchDetails"></div>
    </div>

    <button class="btn-back" onclick="location.href='index.html'">← 처음으로 돌아가기</button>
</div>

<script>
    const GOOGLE_APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxgDxsS7VlFoS74yZmIedp-jo3EVb72UaA5AeUbNdGupYup1XTrukNAa1xf3OwlybNu/exec';

    const matchBtn = document.getElementById('matchBtn');
    const searchNameInput = document.getElementById('searchName');
    const resultBox = document.getElementById('resultBox');
    const resultSummary = document.getElementById('resultSummary');
    const matchDetails = document.getElementById('matchDetails');

    matchBtn.addEventListener('click', async function () {
        const myName = searchNameInput.value.trim();

        if (!myName) {
            alert('이름을 입력해주세요!');
            searchNameInput.focus();
            return;
        }

        matchBtn.disabled = true;
        matchBtn.innerText = '🤖 AI 분석 중...';
        resultBox.style.display = 'none';

        try {
            // no-cors 없이 POST → 응답 바로 읽기
            const response = await fetch(GOOGLE_APP_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'analyze', name: myName })
            });

            const result = await response.json();

            if (result.result !== 'success') {
                alert('분석에 실패했습니다: ' + (result.message || ''));
                return;
            }

            resultBox.style.display = 'block';
            resultSummary.innerHTML = `🎉 <span style="color:#4a148c;">${myName}</span>님의 소울메이트는...`;
            matchDetails.innerHTML = `<div class="gemini-result">${result.analysis}</div>`;

        } catch (error) {
            console.error('Error:', error);
            alert('분석 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
        } finally {
            matchBtn.disabled = false;
            matchBtn.innerText = '🔍 닮은 사람 찾기';
        }
    });
</script>
</body>
</html>
